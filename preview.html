<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AUREAS Ingeniería — Simulador y Vista Previa Móvil</title>
<meta name="description" content="Simulador interactivo de la versión móvil para AUREAS Ingeniería. Comprueba la adaptabilidad responsive en diferentes dispositivos.">
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<style>
  :root {
    --bg-sim: #090a0c;
    --panel-sim: #131518;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);
    --text: #e6e8eb;
    --text-muted: #8b929a;
    --turquoise: #00c4c4;
    --gold: #d9b45b;
    --font-display: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 6px;
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 14px;
    --sp-4: 20px;
    --sp-5: 32px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    
    /* Device frame settings */
    --dev-width: 390px;
    --dev-height: 844px;
    --dev-radius: 46px;
    --scale: 0.92;
  }

  *, *::before, *::after { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg-sim);
    color: var(--text);
    font-family: var(--font-display);
    overflow-x: hidden;
  }

  .preview-layout {
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 100vh;
  }

  /* Top Control Bar */
  .preview-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(19, 21, 24, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: var(--sp-2) var(--sp-4);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
  }

  .preview-bar__brand {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
  }

  .preview-bar__brand img {
    height: 24px;
    width: auto;
  }

  .preview-bar__badge {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 3px;
    background: rgba(0, 196, 196, 0.12);
    color: var(--turquoise);
    border: 1px solid rgba(0, 196, 196, 0.3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .preview-bar__controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--sp-2);
  }

  .btn-sim {
    background: #1a1d21;
    border: 1px solid var(--line);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: var(--radius);
    font-size: 0.82rem;
    font-family: var(--font-mono);
    cursor: pointer;
    transition: all 0.2s var(--ease);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
  }

  .btn-sim:hover {
    background: #24282f;
    color: var(--text);
    border-color: var(--line-strong);
  }

  .btn-sim.is-active {
    background: rgba(0, 196, 196, 0.16);
    color: var(--turquoise);
    border-color: var(--turquoise);
  }

  .select-sim {
    background: #1a1d21;
    border: 1px solid var(--line);
    color: var(--text);
    padding: 6px 12px;
    border-radius: var(--radius);
    font-size: 0.82rem;
    font-family: var(--font-mono);
    cursor: pointer;
    outline: none;
  }

  .select-sim:focus {
    border-color: var(--turquoise);
  }

  /* Stage Canvas */
  .preview-stage {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--sp-5) var(--sp-3);
    position: relative;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 24px 24px;
    overflow: auto;
  }

  /* Phone Mockup Chassis */
  .device-chassis {
    position: relative;
    width: var(--dev-width);
    height: var(--dev-height);
    background: #1a1d21;
    border-radius: var(--dev-radius);
    box-shadow: 
      0 0 0 4px #2e333a,
      0 0 0 6px #121417,
      0 25px 60px -10px rgba(0, 0, 0, 0.8),
      0 0 50px rgba(0, 196, 196, 0.15);
    transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    transform: scale(var(--scale));
    transform-origin: center center;
    overflow: hidden;
    border: 3px solid #373c44;
  }

  .device-chassis.is-landscape {
    width: var(--dev-height);
    height: var(--dev-width);
  }

  /* Dynamic Island / Notch */
  .device-notch {
    display: none;
  }

  /* Status Bar */
  .device-status-bar {
    position: relative;
    height: 28px;
    padding: 6px 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #131518;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    color: #a7acb1;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    pointer-events: none;
    z-index: 40;
  }

  .status-icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Screen Iframe */
  .device-screen {
    width: 100%;
    height: calc(100% - 28px);
    border: none;
    background: #131518;
  }

  /* Footer info */
  .preview-footer-info {
    text-align: center;
    padding: var(--sp-2) var(--sp-4);
    font-family: var(--font-mono);
    font-size: 0.76rem;
    color: var(--text-muted);
    border-top: 1px solid var(--line);
    background: var(--panel-sim);
  }
</style>
</head>
<body>

<div class="preview-layout">
  <!-- Top Toolbar -->
  <header class="preview-bar">
    <div class="preview-bar__brand">
      <img src="/assets/img/logo-aureas-light.png" alt="AUREAS">
      <span class="preview-bar__badge">Vista Móvil</span>
    </div>

    <!-- Navigation between site sections in simulator -->
    <div class="preview-bar__controls">
      <button class="btn-sim is-active" data-page="/" onclick="loadPage('/')">Inicio</button>
      <button class="btn-sim" data-page="/servicios/" onclick="loadPage('/servicios/')">Servicios (Rueda)</button>
      <button class="btn-sim" data-page="/quienes-somos/" onclick="loadPage('/quienes-somos/')">Quiénes somos</button>
      <button class="btn-sim" data-page="/contacto/" onclick="loadPage('/contacto/')">Contacto</button>
    </div>

    <!-- Device switcher & zoom controls -->
    <div class="preview-bar__controls">
      <select class="select-sim" id="deviceSelect" onchange="changeDevice(this.value)" aria-label="Seleccionar dispositivo">
        <option value="iphone15" selected>iPhone 15 / 14 Pro (390×844)</option>
        <option value="iphonese">iPhone SE (375×667)</option>
        <option value="pixel7">Google Pixel 7 (412×915)</option>
        <option value="galaxys23">Samsung Galaxy S23 (360×780)</option>
        <option value="ipadmini">iPad Mini (768×1024)</option>
      </select>

      <button class="btn-sim" onclick="toggleOrientation()" title="Rotar pantalla">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
      </button>

      <button class="btn-sim" onclick="adjustScale(-0.1)" title="Alejar zoom">−</button>
      <button class="btn-sim" onclick="adjustScale(0.1)" title="Acercar zoom">+</button>

      <a class="btn-sim" id="directLink" href="/" target="_blank" title="Abrir en pestaña nueva">
        <span>Abrir pestaña</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
    </div>
  </header>

  <!-- Interactive Mockup Screen Stage -->
  <main class="preview-stage">
    <div class="device-chassis" id="chassis">
      <!-- Device Status Bar -->
      <div class="device-status-bar">
        <span id="currentTime">09:41</span>
        <div class="status-icons">
          <svg width="14" height="10" viewBox="0 0 16 12" fill="currentColor"><path d="M1 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm4.5 1a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm4.5 1a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm4.5 0.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>
          <svg width="15" height="10" viewBox="0 0 24 16" fill="currentColor"><path d="M12 3c-4.97 0-9.28 2.15-12 5.54l12 11.46 12-11.46c-2.72-3.39-7.03-5.54-12-5.54z"/></svg>
          <svg width="18" height="10" viewBox="0 0 24 12" fill="currentColor"><rect x="1" y="1" width="18" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="3" width="12" height="6" rx="1.5"/><path d="M21 4.5v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
      </div>

      <!-- Iframe viewport -->
      <iframe class="device-screen" id="previewIframe" src="/" title="Vista previa de AUREAS Ingeniería"></iframe>
    </div>
  </main>

  <footer class="preview-footer-info">
    <span>💡 AUREAS Ingeniería · Vista previa interactiva responsive</span>
  </footer>
</div>

<script>
  const iframe = document.getElementById('previewIframe');
  const chassis = document.getElementById('chassis');
  const directBtn = document.getElementById('directLink');
  let isLandscape = false;
  let currentScale = 0.92;

  const devices = {
    iphone15: { width: '390px', height: '844px', radius: '46px' },
    pixel7: { width: '412px', height: '915px', radius: '40px' },
    galaxys23: { width: '360px', height: '780px', radius: '38px' },
    iphonese: { width: '375px', height: '667px', radius: '36px' },
    ipadmini: { width: '768px', height: '1024px', radius: '30px' }
  };

  function loadPage(path) {
    const freshUrl = path + (path.includes('?') ? '&' : '?') + 't=' + Date.now();
    iframe.src = freshUrl;
    directBtn.href = path;
    document.querySelectorAll('[data-page]').forEach(btn => {
      btn.classList.toggle('is-active', btn.getAttribute('data-page') === path);
    });
  }

  function changeDevice(devKey) {
    const dev = devices[devKey] || devices.iphone15;
    document.documentElement.style.setProperty('--dev-width', dev.width);
    document.documentElement.style.setProperty('--dev-height', dev.height);
    document.documentElement.style.setProperty('--dev-radius', dev.radius);
  }

  function toggleOrientation() {
    isLandscape = !isLandscape;
    chassis.classList.toggle('is-landscape', isLandscape);
  }

  function adjustScale(delta) {
    currentScale = Math.min(Math.max(0.4, currentScale + delta), 1.3);
    document.documentElement.style.setProperty('--scale', currentScale);
  }

  // Live clock updating in device status bar
  function updateClock() {
    const now = new Date();
    const hrs = String(now.getHours()).padStart(2, '0');
    const mins = String(now.getMinutes()).padStart(2, '0');
    const el = document.getElementById('currentTime');
    if (el) el.textContent = `${hrs}:${mins}`;
  }
  setInterval(updateClock, 1000);
  updateClock();
</script>
</body>
</html>
